<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>照片挑選 - 輔助顯示視窗</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<link rel="stylesheet" href="/fonts/source-sans-3.css">
<link rel="stylesheet" href="assets/second.css">
</head>
<body>
<!-- 照片挑選's second window, as Lightroom's secondary display: every photo as a grid, following the one you're on in
     the pick tool's window (assets/second.js). A black strip on top, the grid, the toolbar under it. -->
<div class="top"><button type="button" class="grip" id="sGrip" title="全螢幕（F）" aria-label="全螢幕"></button></div>
<main class="grid" id="sGrid" tabindex="-1" aria-label="所有照片"><div class="grid-in" id="sIn"></div></main>
<p class="msg" id="sState" role="status" hidden>照片挑選關掉了・再打開放進照片，這裡會自動換上</p>
<p class="empty" id="sEmpty">打開「照片挑選」放進照片，所有照片就會排在這裡。<br>這個視窗可以一直開著：換一批照片，這裡會自動換上。</p>
<footer class="bar" id="sBar">
  <p class="src"><span id="sSrc">上次讀入</span><span class="pos" id="sPos"></span><i class="caret" aria-hidden="true"></i></p>
  <label class="zoom"><span>縮圖</span><input type="range" id="sSize" min="110" max="420" step="1" aria-label="縮圖大小（−、＋）"></label>
</footer>
<button type="button" class="tog" id="sTog" tabindex="-1" title="隱藏或顯示工具列" aria-label="隱藏或顯示工具列"></button>
<script src="assets/second.js"></script>
</body>
</html>
