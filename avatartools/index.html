<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ZhuyuanLoveAvatar・Gravatar 頭貼查詢</title>
<meta name="description" content="輸入 Email 就拿到 Gravatar 頭貼：可以一次查很多個、選尺寸、複製網址或打包下載。Email 只在你的瀏覽器裡轉換，不會傳給我們。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZhuyuanTools">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="ZhuyuanLoveAvatar・Gravatar 頭貼查詢">
<meta property="og:description" content="輸入 Email 就拿到 Gravatar 頭貼：可以一次查很多個、選尺寸、複製網址或打包下載。Email 只在你的瀏覽器裡轉換，不會傳給我們。">
<meta property="og:url" content="https://tools.zhuyuan.tw/avatar">
<meta property="og:image" content="https://tools.zhuyuan.tw/avatar/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" id="brand" href="../home/index.html" title="回到 ZhuyuanTools 首頁">
      <img class="logo" src="assets/logo.svg" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="wordmark">Zhuyuan<span class="w-love">Love</span><span class="w-tool">Avatar</span></span>
        <span class="tagline">Gravatar 頭貼查詢工具</span>
      </span>
    </a>
    <p class="privacy">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span class="privacy-long">Email 只在你的瀏覽器裡轉換，不會傳給我們。</span><span class="privacy-short">不上傳</span>
    </p>
  </header>

  <main>
    <section class="panel fill" id="tool" aria-labelledby="h1t">
      <div class="hero" id="hero">
        <div class="hero-text">
          <h2 class="hero-title" id="h1t">輸入 Email，拿到<em>頭貼</em></h2>
          <p class="hero-count" id="heroCount" aria-live="polite">免費・免註冊・Email 不外流</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 300 150" width="300" height="150">
            <g class="ha-mail">
              <rect x="6" y="30" width="112" height="78" rx="12" class="ha-page"/>
              <path d="M10 38l52 38 52-38" class="ha-fold"/>
              <rect x="22" y="116" width="80" height="28" rx="8" class="ha-chip-plain"/>
              <text x="62" y="135" class="ha-chip-text">@email</text>
            </g>
            <g class="ha-arrow"><path d="M134 70h36"/><path d="M162 60l10 10-10 10"/></g>
            <g class="ha-face">
              <circle cx="238" cy="68" r="50" class="ha-ring"/>
              <circle cx="238" cy="56" r="16" class="ha-head"/>
              <path d="M206 102c6-16 18-24 32-24s26 8 32 24a50 50 0 0 1-64 0z" class="ha-head"/>
              <circle cx="280" cy="28" r="14" class="ha-check-bg"/>
              <path d="M273.5 28.5l4.5 4.5 8-9" class="ha-check"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="panel-body tool-body">
        <div class="inputs">
          <label class="set-label" for="emails">Email</label>
          <textarea id="emails" rows="5" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="name@example.com&#10;一行一個，也可以直接貼一整串名單"></textarea>
          <p class="help" id="emailNote">名單直接貼上就好，會自動抓出 Email</p>

          <details class="opts" id="opts" open>
            <summary><span>選項</span><span class="opts-sum" id="optsSum"></span></summary>
            <div class="set">
              <span class="set-label" id="lblSize">尺寸</span>
              <div class="chips" role="radiogroup" aria-labelledby="lblSize">
                <label class="chip"><input type="radio" name="size" value="80"><span>80</span></label>
                <label class="chip"><input type="radio" name="size" value="200" checked><span>200</span></label>
                <label class="chip"><input type="radio" name="size" value="400"><span>400</span></label>
                <label class="chip"><input type="radio" name="size" value="800"><span>800</span></label>
                <label class="chip"><input type="radio" name="size" value="2048"><span>2048</span></label>
                <span class="unit">px</span>
              </div>
            </div>

            <div class="set">
              <span class="set-label" id="lblDef">沒有頭貼時 <span class="def-name" id="defName">預設人像</span></span>
              <div class="defaults" id="defaults" role="radiogroup" aria-labelledby="lblDef"></div>
            </div>

            <div class="set two">
              <div>
                <span class="set-label" id="lblRating">分級</span>
                <div class="seg" role="radiogroup" aria-labelledby="lblRating">
                  <label title="適合所有人"><input type="radio" name="rating" value="g" checked><span>G</span></label>
                  <label title="可能有粗話、輕微暴力"><input type="radio" name="rating" value="pg"><span>PG</span></label>
                  <label title="限制級"><input type="radio" name="rating" value="r"><span>R</span></label>
                  <label title="成人內容"><input type="radio" name="rating" value="x"><span>X</span></label>
                </div>
              </div>
              <div>
                <span class="set-label" id="lblHash">雜湊</span>
                <div class="seg" role="radiogroup" aria-labelledby="lblHash">
                  <label title="Gravatar 現在建議的格式"><input type="radio" name="hash" value="sha256" checked><span>SHA-256</span></label>
                  <label title="舊系統常用的格式"><input type="radio" name="hash" value="md5"><span>MD5</span></label>
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="results" id="results" aria-live="polite"></div>
      </div>

      <div class="panel-foot">
        <span class="foot-note" id="note">還沒有輸入 Email。</span>
        <button type="button" class="btn" id="copyAll" disabled>複製全部網址</button>
        <button type="button" class="btn primary" id="zipAll" disabled>全部下載（ZIP）</button>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
