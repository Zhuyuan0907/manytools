<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>影片碼率壓縮・ManyTools</title>
<meta name="description" content="把業務機錄出來的高碼率影片壓到指定碼率。影片只在你的電腦裡處理，不會上傳到任何伺服器。">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" id="brand" href="../home/index.html" title="回到 ManyTools 首頁">
      <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
      <span class="wordmark">影片碼率壓縮</span>
    </a>
    <p class="privacy">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span class="privacy-long">影片只在你的電腦處理，不會上傳</span><span class="privacy-short">不上傳</span>
    </p>
  </header>

  <nav class="stepper" aria-label="步驟">
    <ol>
      <li><button type="button" data-goto="1"><span class="dot">1</span><span class="lbl">放入影片</span></button></li>
      <li><button type="button" data-goto="2"><span class="dot">2</span><span class="lbl">影片資訊</span></button></li>
      <li><button type="button" data-goto="3"><span class="dot">3</span><span class="lbl">壓縮設定</span></button></li>
      <li><button type="button" data-goto="4"><span class="dot">4</span><span class="lbl">處理與下載</span></button></li>
    </ol>
  </nav>

  <main>
    <p id="support" class="banner" hidden></p>

    <!-- ============ STEP 1 ============ -->
    <section class="panel" id="step1" aria-labelledby="h1t">
      <div class="panel-head">
        <h2 id="h1t"><span>業務機素材，</span><span>壓到剛剛好的碼率</span></h2>
        <p>先看清楚影片資訊，再決定要壓到多少</p>
      </div>
      <div class="panel-body step1-body">
        <label class="drop" id="drop" for="fileInput">
          <input type="file" id="fileInput" accept="video/*,.mp4,.mov,.m4v,.mts,.m2ts,.ts,.mkv,.webm,.mxf" multiple aria-label="選擇影片檔">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="14" height="14" rx="2.5"></rect><path d="m16.5 10 5-3v10l-5-3"></path><path d="M9.5 15.5v-6"></path><path d="m7 12 2.5-2.5L12 12"></path></svg>
          <span class="drop-title"><span class="d-desk">把影片拖進這裡</span><span class="d-mob">選擇影片</span></span>
          <span class="drop-hint"><span class="d-desk">或點一下選擇檔案・</span>可以一次放很多支</span>
          <span class="drop-formats">MP4・MOV・MTS / M2TS・MKV</span>
        </label>
        <ul class="facts" aria-label="特色">
          <li><b>不上傳</b><span>全程在你的電腦處理</span></li>
          <li><b>硬體加速</b><span>用顯示卡編碼，速度快</span></li>
          <li><b>聲音不重壓</b><span>LPCM、AAC 原樣保留</span></li>
        </ul>
      </div>
      <div class="panel-foot">
        <span class="foot-note" id="note1">還沒有加入影片</span>
        <button type="button" class="btn primary" id="next1" disabled>下一步</button>
      </div>
    </section>

    <!-- ============ STEP 2 ============ -->
    <section class="panel" id="step2" aria-labelledby="h2t" hidden>
      <div class="panel-head">
        <h2 id="h2t">確認影片資訊</h2>
        <p>先看原始碼率，再決定要壓到多少</p>
      </div>
      <div class="panel-body step2-body">
        <div class="flist-wrap">
          <ol class="flist" id="flist" aria-label="影片清單"></ol>
          <button type="button" class="btn link add-more" id="addMore">＋ 加入影片</button>
        </div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
      <div class="panel-foot">
        <button type="button" class="btn back" data-goto="1"><span aria-hidden="true">←</span><span class="lbl">放入影片</span></button>
        <span class="foot-note" id="note2"></span>
        <button type="button" class="btn primary" id="next2" disabled>下一步</button>
      </div>
    </section>

    <!-- ============ STEP 3 ============ -->
    <section class="panel" id="step3" aria-labelledby="h3t" hidden>
      <div class="panel-head">
        <h2 id="h3t">要壓到多少碼率？</h2>
        <p>設定會套用到清單裡的每一支影片</p>
      </div>
      <div class="panel-body step3-body">
        <div class="settings">
          <div class="rate">
            <label class="rate-label" for="rate">目標影像碼率</label>
            <div class="rate-main">
              <span class="rate-value"><input type="number" id="rate" min="0.5" max="400" step="0.5" value="12" inputmode="decimal"><span class="unit">Mbps</span></span>
              <span class="nudges">
                <button type="button" class="nudge" data-nudge="-1" aria-label="減少 1 Mbps">−</button>
                <button type="button" class="nudge" data-nudge="1" aria-label="增加 1 Mbps">+</button>
              </span>
            </div>
            <div class="slider">
              <input type="range" id="rateRange" min="1" max="30" step="0.5" value="12" aria-label="目標碼率">
              <span class="src-mark" id="srcMark" hidden><span id="srcMarkText"></span></span>
            </div>
            <div class="scale" aria-hidden="true"><span id="scaleMin">1</span><span id="scaleMax">30 Mbps</span></div>
          </div>

          <div class="opts">
            <div class="opt">
              <span class="label" id="lblMode">碼率模式</span>
              <div class="radios" role="radiogroup" aria-labelledby="lblMode">
                <label><input type="radio" name="mode" value="variable" checked><span><b>VBR</b>畫質較好</span></label>
                <label><input type="radio" name="mode" value="constant"><span><b>CBR</b>播出系統用</span></label>
              </div>
            </div>
            <div class="opt">
              <span class="label" id="lblCodec">編碼格式</span>
              <div class="radios" role="radiogroup" aria-labelledby="lblCodec">
                <label><input type="radio" name="codec" value="avc" checked><span><b>H.264</b>相容性最好</span></label>
                <label id="hevcOpt"><input type="radio" name="codec" value="hevc"><span><b>H.265</b><i>同碼率更清楚</i></span></label>
              </div>
            </div>
          </div>

          <div class="selects">
            <label><span>解析度</span>
              <select id="res">
                <option value="0">維持原始</option>
                <option value="2160">4K</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
              </select>
            </label>
            <label><span>關鍵影格</span>
              <select id="gop">
                <option value="1">每 1 秒</option>
                <option value="2" selected>每 2 秒</option>
                <option value="5">每 5 秒</option>
              </select>
            </label>
            <label><span>聲音</span>
              <select id="audio">
                <option value="copy">原樣保留</option>
                <option value="aac">轉 AAC</option>
                <option value="none">移除</option>
              </select>
            </label>
            <label><span>輸出格式</span>
              <select id="fmt">
                <option value="auto">同原檔</option>
                <option value="mp4">MP4</option>
                <option value="mov">MOV</option>
              </select>
            </label>
          </div>
        </div>

        <div class="preview">
          <dl class="total" id="total"></dl>
          <ol class="plist" id="plist" aria-label="每支影片的預估結果"></ol>
        </div>
      </div>
      <div class="panel-foot">
        <button type="button" class="btn back" data-goto="2"><span aria-hidden="true">←</span><span class="lbl">影片資訊</span></button>
        <span class="foot-note" id="note3"></span>
        <button type="button" class="btn primary" id="runAll" disabled>開始壓縮</button>
      </div>
    </section>

    <!-- ============ STEP 4 ============ -->
    <section class="panel" id="step4" aria-labelledby="h4t" hidden>
      <div class="panel-head">
        <h2 id="h4t">正在壓縮</h2>
        <p id="h4p">處理中請不要關閉這個分頁</p>
      </div>
      <div class="panel-body step4-body">
        <div class="overall" id="overall"></div>
        <ol class="rlist" id="rlist" aria-label="處理進度"></ol>
      </div>
      <div class="panel-foot">
        <button type="button" class="btn back" id="back4" data-goto="3"><span aria-hidden="true">←</span><span class="lbl">回去改設定</span></button>
        <span class="foot-note" id="note4"></span>
        <button type="button" class="btn" id="stopRun">停止</button>
        <button type="button" class="btn primary" id="restart" hidden>再壓一批</button>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="lib/mediabunny.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
