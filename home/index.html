<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ManyTools・本機工具箱</title>
<meta name="description" content="影片碼率壓縮、PDF 壓縮拆分等工具。所有處理都在你自己的電腦上完成，檔案不會上傳到任何伺服器。">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/home.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="./">
      <img class="logo" src="assets/logo.svg" alt="" width="44" height="44">
      <span class="wordmark">Many<span class="w-accent">Tools</span></span>
    </a>
    <p class="privacy">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span>檔案不上傳</span>
    </p>
  </header>

  <main>
    <section class="hero">
      <h1><span>工具在這裡，</span><em>檔案留在你的電腦</em></h1>
      <p class="lead"><span>壓縮、轉檔、重新輸出，</span><span>都在你自己的瀏覽器完成，</span><span>我們拿不到任何檔案</span></p>
      <p class="count" id="count" aria-live="polite"><span class="pill">免費・免註冊・檔案不上傳</span></p>
    </section>

    <section class="tools" aria-label="工具">
      <a class="tool" href="/video" data-local="../videotools/index.html" style="--c:#2468e0;--c-strong:#1a52b8;--c-soft:#e6effd">
        <span class="tool-head">
          <img src="assets/tool-video.svg" alt="" width="56" height="56">
          <span class="tool-title"><b>影片碼率壓縮</b><span>業務機高碼率素材，壓到指定碼率</span></span>
        </span>
        <ul class="points">
          <li>先看碼率、解析度、聲音軌</li>
          <li>VBR / CBR・H.264 / H.265</li>
          <li>聲音原樣保留，不重壓</li>
        </ul>
        <span class="cta">開始壓縮影片 <span aria-hidden="true">→</span></span>
      </a>
      <a class="tool" href="/pdf" data-local="../pdftools/local/index.html" style="--c:#0d9b6c;--c-strong:#08774f;--c-soft:#e3f6ee">
        <span class="tool-head">
          <img src="assets/tool-pdf.svg" alt="" width="56" height="56">
          <span class="tool-title"><b>PDF 壓縮・拆分</b><span>備審資料壓到上限內，也能拆成多份</span></span>
        </span>
        <ul class="points">
          <li>指定檔案大小上限</li>
          <li>整份或拆成多份上傳</li>
          <li>連結、目錄、書籤都保留</li>
        </ul>
        <span class="cta">開始處理 PDF <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>

  <footer class="foot">
    <p><span>建議使用最新版 Chrome 或 Edge・</span><span>網站只記錄處理的數量，不記錄檔名或內容</span></p>
  </footer>
</div>
<script src="assets/home.js"></script>
</body>
</html>
