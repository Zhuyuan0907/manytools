<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首頁方案 C・暖色明亮</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<style>
/* 方案 C — warm and friendly: cream paper, soft round cards, the sunny yellow as the one accent */
:root {
  --paper: #fbf7f0; --card: #ffffff; --ink: #2a2520; --ink-2: #6b6259; --muted: #9a9087; --line: #ece4d8;
  --sun: #ffb21e; --sun-soft: #fff1d1; --coral: #e2483b;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC Web", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, p { margin: 0; }
.ph { display: inline-block; }
.app { min-height: 100dvh; max-width: 1100px; margin: 0 auto; padding: 18px 28px 18px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 800; font-size: 1.25rem; }
.brand img { width: 36px; height: 36px; border-radius: 10px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); font-size: .85rem; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3bb273; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
.hero { display: grid; gap: 18px; }
.sticker { justify-self: start; transform: rotate(-3deg); padding: 6px 14px; border-radius: 10px; background: var(--sun); color: #3a2a00; font-weight: 800; font-size: .9rem; box-shadow: 0 6px 16px rgba(255, 178, 30, .35); white-space: nowrap; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 2.8vw, 3.4rem); line-height: 1.2; font-weight: 800; letter-spacing: .01em; }
.hero h1 .ph:last-child { color: var(--coral); }
.hero p { color: var(--ink-2); font-size: 1.05rem; }
.count { padding: 4px 0 0 14px; border-left: 4px solid var(--sun); }
.count p { font-size: .95rem; color: var(--ink-2); line-height: 1.45; }
.count b { color: var(--ink); font-size: 1.15rem; }
.tools { display: grid; gap: 16px; }
.tool { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 22px 22px 22px 20px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 14px 34px rgba(80, 60, 30, .08); color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; }
.tool:hover { transform: translateY(-3px) rotate(-.3deg); box-shadow: 0 1px 0 var(--line), 0 20px 44px rgba(80, 60, 30, .14); }
.icon { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: var(--soft); }
.icon img { width: 50px; height: 50px; border-radius: 13px; display: block; }
.text { display: grid; gap: 4px; min-width: 0; }
.text h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.3; white-space: nowrap; }
.text p { color: var(--ink-2); font-size: .95rem; }
.text .mini { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 1.1rem; transition: transform .15s, background .15s; }
.tool:hover .go { transform: translateX(3px); background: var(--coral); }
.foot { color: var(--muted); font-size: .82rem; text-align: center; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; gap: 26px; } .hero { justify-items: start; } }
@media (max-width: 520px) {
  .app { padding: 12px 16px; }
  .badge { font-size: .78rem; padding: 4px 10px; }
  .hero { gap: 12px; }
  .hero h1 { font-size: 1.9rem; }
  .hero p { font-size: .92rem; }
  .tool { padding: 16px; gap: 12px; border-radius: 20px; }
  .icon { width: 56px; height: 56px; border-radius: 16px; }
  .icon img { width: 40px; height: 40px; }
  .text h2 { font-size: 1.12rem; }
  .text .mini { display: none; }
  .go { width: 38px; height: 38px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="">ManyTools</a>
    <span class="badge">檔案不上傳</span>
  </header>
  <main>
    <section class="hero">
      <span class="sticker">免費・免註冊</span>
      <h1><span class="ph">工具在這裡，</span><span class="ph">檔案留在你的電腦</span></h1>
      <p><span class="ph">壓縮、轉檔、重新輸出，</span><span class="ph">都在你自己的瀏覽器完成，</span><span class="ph">我們拿不到任何檔案。</span></p>
      <div class="count">
        <p>已經幫大家處理 <b data-stat="video.files">0</b> 部影片、<b data-stat="pdf.files">0</b> 份 PDF<br>一共省下 <b data-stat="saved">0 MB</b></p>
      </div>
    </section>
    <section class="tools" aria-label="工具">
      <a class="tool" href="/video" style="--soft:#e6effd">
        <span class="icon"><img src="/assets/tool-video.svg" alt=""></span>
        <span class="text"><h2>影片碼率壓縮</h2><p>業務機高碼率素材，壓到指定碼率</p><span class="mini">MP4・MOV・MTS・聲音原樣保留</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="tool" href="/pdf" style="--soft:#e3f6ee">
        <span class="icon"><img src="/assets/tool-pdf.svg" alt=""></span>
        <span class="text"><h2>PDF 壓縮・拆分</h2><p>備審資料壓到上限內，也能拆成多份</p><span class="mini">指定大小上限・連結、書籤保留</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
  <footer class="foot">建議使用最新版 Chrome 或 Edge・網站只記錄處理的數量，不記錄檔名或內容</footer>
</div>
<script src="stats.js"></script>
</body>
</html>
