<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首頁方案 A・品牌雙卡</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<style>
/* 方案 A — the home page speaks the tools' own language: tinted page, two themed cards with each tool's hero art */
:root {
  --ink: #17202c; --ink-2: #485365; --muted: #778193; --line: #e2e8ef;
  --blue: #2468e0; --blue-strong: #1a52b8; --blue-soft: #e6effd;
  --green: #0d9b6c; --green-strong: #08774f; --green-soft: #e3f6ee;
  --seal: #e2483b; --sun: #ffb21e;
  --shadow: 0 1px 2px rgba(23, 32, 44, .05), 0 10px 30px rgba(23, 32, 44, .08);
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC Web", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: #f3f6fa; }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, #e7eefb 0, #f3f6fa 320px) no-repeat, #f3f6fa; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, p { margin: 0; }
.ph { display: inline-block; }
.app { min-height: 100dvh; max-width: 1180px; margin: 0 auto; padding: 16px 24px 18px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
.brand img { width: 40px; height: 40px; border-radius: 10px; display: block; }
.brand b { font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--ink-2); font-size: .84rem; font-weight: 500; white-space: nowrap; }
main { display: grid; align-content: center; gap: clamp(18px, 4vh, 36px); }
.hero { text-align: center; display: grid; gap: 12px; justify-items: center; }
.hero h1 { font-size: clamp(1.8rem, 1.2rem + 2.2vw, 2.8rem); line-height: 1.25; font-weight: 800; letter-spacing: .02em; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--sun) 55%, transparent) 62%, color-mix(in srgb, var(--sun) 55%, transparent) 92%, transparent 92%); }
.hero p { color: var(--ink-2); font-size: 1.02rem; }
.stats { display: flex; gap: 10px 36px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.stat { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; color: var(--ink-2); }
.stat b { font-size: 1.7rem; font-weight: 800; color: var(--ink); line-height: 1; }
.stat.v b { color: var(--blue-strong); }
.stat.p b { color: var(--green-strong); }
.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.tool { --c: var(--blue); --cs: var(--blue-strong); --soft: var(--blue-soft); display: grid; grid-template-rows: auto 1fr; border-radius: 20px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); color: inherit; text-decoration: none; overflow: hidden; transition: transform .15s, box-shadow .15s; }
.tool.pdf { --c: var(--green); --cs: var(--green-strong); --soft: var(--green-soft); }
.tool:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(23, 32, 44, .05), 0 18px 40px rgba(23, 32, 44, .12); }
.art { position: relative; display: grid; place-items: center; padding: 18px 20px 14px; background: var(--soft); background-image: linear-gradient(color-mix(in srgb, var(--c) 10%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, transparent) 1px, transparent 1px); background-size: 24px 24px; }
.art svg { width: min(250px, 80%); height: auto; display: block; }
.art img { position: absolute; left: 18px; top: 16px; width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 4px 12px color-mix(in srgb, var(--c) 30%, transparent); }
.body { display: grid; gap: 6px; padding: 18px 24px 22px; align-content: start; }
.word { font-size: .86rem; font-weight: 800; color: var(--ink-2); letter-spacing: -.01em; }
.word i { font-style: normal; color: var(--seal); }
.word u { text-decoration: none; color: var(--c); }
.body h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.3; }
.desc { color: var(--ink-2); }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tags span { font-size: .8rem; color: var(--cs); font-weight: 600; white-space: nowrap; }
.tags span + span::before { content: "・"; color: var(--muted); margin-right: 8px; }
.cta { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 10px; background: var(--c); color: #fff; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px color-mix(in srgb, var(--c) 28%, transparent); }
.tool:hover .cta { background: var(--cs); }
.foot { color: var(--muted); font-size: .82rem; text-align: center; }
/* svg art */
.page { fill: #fff; stroke: #cdd6e0; stroke-width: 2; }
.small .page { stroke: color-mix(in srgb, var(--c) 55%, #fff); }
.lines { stroke: #e2e8ef; stroke-width: 6; stroke-linecap: round; fill: none; }
.holes { stroke: #cdd6e0; stroke-width: 5; stroke-linecap: round; fill: none; }
.small .holes { stroke: color-mix(in srgb, var(--c) 40%, #fff); stroke-width: 4; }
.play { fill: #cdd6e0; } .small .play { fill: var(--c); }
.chip-bad { fill: #fde9e6; } .chip-ok { fill: #fff; }
.chip-t { font: 800 15px var(--font); text-anchor: middle; fill: #d13a2c; }
.small .chip-t { fill: var(--cs); font-size: 13px; }
.arrow path { fill: none; stroke: var(--c); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.check-bg { fill: var(--c); } .check { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@media (max-height: 760px) { .art svg { width: min(200px, 70%); } .art { padding: 12px 20px 10px; } .body { padding: 14px 22px 18px; } }
@media (max-width: 760px) {
  .tools { grid-template-columns: 1fr; gap: 14px; }
  .art { display: none; }
  .body { padding: 16px 18px; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; }
  .body::before { content: ""; grid-row: span 3; width: 46px; height: 46px; border-radius: 11px; background: var(--c) var(--icon) center / cover; }
  .foot-row { grid-column: 1 / -1; }
  .pill .more { display: none; }
}
@media (max-width: 520px) { .app { padding: 12px 16px; } .hero h1 { font-size: 1.6rem; } .hero p { font-size: .92rem; } .stat b { font-size: 1.35rem; } .tags { display: none; } .cta { flex: 1; justify-content: center; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt=""><b>ManyTools</b></a>
    <p class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><span>檔案不上傳<span class="more">・全部在你的電腦處理</span></span></p>
  </header>
  <main>
    <section class="hero">
      <h1><span class="ph">工具在這裡，</span><span class="ph">檔案留在<em>你的電腦</em></span></h1>
      <p><span class="ph">壓縮、轉檔、重新輸出，</span><span class="ph">都在你自己的瀏覽器完成</span></p>
      <div class="stats">
        <span class="stat v">已處理 <b data-stat="video.files">0</b> 部影片</span>
        <span class="stat p"><b data-stat="pdf.files">0</b> 份 PDF</span>
        <span class="stat">省下 <b data-stat="saved">0 MB</b></span>
      </div>
    </section>
    <section class="tools" aria-label="工具">
      <a class="tool" href="/video" style="--icon:url(/assets/tool-video.svg)">
        <div class="art" aria-hidden="true">
          <img src="/assets/tool-video.svg" alt="">
          <svg viewBox="0 0 300 160">
            <g><rect x="6" y="16" width="122" height="96" rx="12" class="page"/><path d="M18 21v8M34 21v8M50 21v8M66 21v8M82 21v8M98 21v8M114 21v8M18 99v8M34 99v8M50 99v8M66 99v8M82 99v8M98 99v8M114 99v8" class="holes"/><path d="M58 50v28l24-14z" class="play"/><rect x="27" y="122" width="80" height="30" rx="8" class="chip-bad"/><text x="67" y="142" class="chip-t">20 Mbps</text></g>
            <g class="arrow"><path d="M140 66h36"/><path d="M168 56l10 10-10 10"/></g>
            <g class="small"><rect x="194" y="32" width="96" height="74" rx="10" class="page"/><path d="M205 36v6M219 36v6M233 36v6M247 36v6M261 36v6M275 36v6M205 96v6M219 96v6M233 96v6M247 96v6M261 96v6M275 96v6" class="holes"/><path d="M235 58v20l17-10z" class="play"/><rect x="208" y="116" width="68" height="26" rx="7" class="chip-ok"/><text x="242" y="134" class="chip-t">12 Mbps</text><circle cx="286" cy="34" r="14" class="check-bg"/><path d="M279.5 34.5l4.5 4.5 8-9" class="check"/></g>
          </svg>
        </div>
        <div class="body">
          <span class="word">Zhuyuan<i>Love</i><u>Video</u></span>
          <h2>影片碼率壓縮</h2>
          <p class="desc">業務機高碼率素材，壓到指定碼率</p>
          <div class="foot-row"><span class="tags"><span>MP4・MOV・MTS</span><span>聲音不重壓</span></span><span class="cta">開始壓縮 →</span></div>
        </div>
      </a>
      <a class="tool pdf" href="/pdf" style="--icon:url(/assets/tool-pdf.svg)">
        <div class="art" aria-hidden="true">
          <img src="/assets/tool-pdf.svg" alt="">
          <svg viewBox="0 0 300 160">
            <g><rect x="16" y="6" width="104" height="128" rx="10" class="page"/><path d="M34 40h56M34 54h68M34 68h68M34 82h48" class="lines"/><rect x="28" y="96" width="80" height="30" rx="8" class="chip-bad"/><text x="68" y="116" class="chip-t">50 MB</text></g>
            <g class="arrow"><path d="M136 70h36"/><path d="M164 60l10 10-10 10"/></g>
            <g class="small"><rect x="196" y="28" width="80" height="104" rx="9" class="page"/><path d="M210 58h42M210 69h52M210 80h36" class="lines"/><rect x="204" y="96" width="64" height="26" rx="7" class="chip-ok"/><text x="236" y="114" class="chip-t">5 MB</text><circle cx="272" cy="30" r="14" class="check-bg"/><path d="M265.5 30.5l4.5 4.5 8-9" class="check"/></g>
          </svg>
        </div>
        <div class="body">
          <span class="word">Zhuyuan<i>Love</i><u>PDF</u></span>
          <h2>PDF 壓縮・拆分</h2>
          <p class="desc">備審資料壓到上限內，也能拆成多份</p>
          <div class="foot-row"><span class="tags"><span>指定大小上限</span><span>書籤保留</span></span><span class="cta">開始處理 →</span></div>
        </div>
      </a>
    </section>
  </main>
  <footer class="foot">建議使用最新版 Chrome 或 Edge・網站只記錄處理的數量，不記錄檔名或內容</footer>
</div>
<script src="stats.js"></script>
</body>
</html>
