<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首頁方案 B・大字編輯</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/noto-sans-tc.css">
<style>
/* 方案 B — editorial: a big headline and big numbers, the tools as numbered rows. Color only marks each tool. */
:root {
  --ink: #111418; --ink-2: #5b6370; --muted: #8b929c; --line: #e3e6ea; --paper: #ffffff;
  --blue: #2468e0; --green: #0d9b6c; --sun: #ffb21e;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC Web", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, p { margin: 0; }
.app { min-height: 100dvh; max-width: 1180px; margin: 0 auto; padding: 18px 40px 20px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .9rem; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.top nav { display: flex; gap: 24px; color: var(--ink-2); }
.top nav a { color: inherit; text-decoration: none; }
.top nav a:hover { color: var(--ink); }
main { display: grid; align-content: center; gap: clamp(24px, 5vh, 48px); }
.lead { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.lead h1 { font-size: clamp(2.2rem, .9rem + 3.6vw, 4rem); line-height: 1.12; font-weight: 800; letter-spacing: -.01em; }
.lead h1 span { display: block; white-space: nowrap; }
.lead h1 .soft { color: var(--muted); }
.lead p { color: var(--ink-2); font-size: 1.05rem; margin-top: 16px; }
.lead p span { display: inline-block; }
.nums { display: grid; gap: 18px; padding-bottom: 8px; }
.num { display: grid; gap: 2px; border-left: 3px solid var(--ink); padding-left: 16px; }
.num.v { border-color: var(--blue); }
.num.p { border-color: var(--green); }
.num b { font-size: clamp(2rem, 1.4rem + 1.8vw, 3rem); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.num span { color: var(--ink-2); font-size: .9rem; white-space: nowrap; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.row { display: grid; grid-template-columns: 64px minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 24px; align-items: center; padding: 18px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.row .no { font-size: 1rem; font-weight: 800; color: var(--c); }
.row h2 { font-size: clamp(1.3rem, 1rem + .9vw, 1.9rem); font-weight: 800; line-height: 1.25; white-space: nowrap; }
.row .d { color: var(--ink-2); }
.row .d small { display: block; color: var(--muted); font-size: .84rem; }
.row .go { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 1.2rem; transition: background .15s, color .15s, transform .15s; }
.row:hover .go { background: var(--c); border-color: var(--c); color: #fff; transform: translateX(4px); }
.row:hover h2 { color: var(--c); }
.foot { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .8rem; flex-wrap: wrap; }
@media (max-width: 900px) {
  .lead { grid-template-columns: 1fr; gap: 20px; }
  .nums { grid-auto-flow: column; justify-content: start; gap: 28px; }
  .row { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .row .d { grid-column: 2; grid-row: 2; }
  .row .go { grid-row: span 2; }
}
@media (max-width: 520px) {
  .app { padding: 14px 18px; }
  .top nav { display: none; }
  .lead h1 { font-size: 2.1rem; }
  .lead p { font-size: .92rem; margin-top: 10px; }
  .num b { font-size: 1.6rem; }
  .row { padding: 14px 0; gap: 4px 12px; }
  .row .d small { display: none; }
  .foot { font-size: .74rem; }
}
@media (max-height: 700px) and (min-width: 521px) { .lead h1 { font-size: clamp(2.2rem, 1rem + 3.2vw, 3.4rem); } .row { padding: 12px 4px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="">ManyTools</a>
    <nav aria-label="工具"><a href="/video">影片碼率壓縮</a><a href="/pdf">PDF 壓縮・拆分</a></nav>
  </header>
  <main>
    <section class="lead">
      <div>
        <h1><span>工具在這裡，</span><span class="soft">檔案留在你的電腦。</span></h1>
        <p><span>壓縮、轉檔、重新輸出，</span><span>都在你自己的瀏覽器完成，</span><span>我們拿不到任何檔案。</span></p>
      </div>
      <div class="nums">
        <div class="num v"><b data-stat="video.files">0</b><span>部影片在大家的電腦上壓好</span></div>
        <div class="num p"><b data-stat="pdf.files">0</b><span>份 PDF 壓到上限內</span></div>
      </div>
    </section>
    <ol class="rows" aria-label="工具">
      <li><a class="row" href="/video" style="--c:var(--blue)"><span class="no">01</span><h2>影片碼率壓縮</h2><span class="d">業務機高碼率素材，壓到指定碼率<small>MP4・MOV・MTS・VBR / CBR・聲音不重壓</small></span><span class="go" aria-hidden="true">→</span></a></li>
      <li><a class="row" href="/pdf" style="--c:var(--green)"><span class="no">02</span><h2>PDF 壓縮・拆分</h2><span class="d">備審資料壓到上限內，也能拆成多份<small>指定大小上限・整份或拆分・書籤保留</small></span><span class="go" aria-hidden="true">→</span></a></li>
    </ol>
  </main>
  <footer class="foot"><span>建議使用最新版 Chrome 或 Edge</span><span>只記錄處理的數量，不記錄檔名或內容</span></footer>
</div>
<script src="stats.js"></script>
</body>
</html>
